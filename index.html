<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Snake</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --bg-color: #050505;
            --grid-color: #1a1a1a;
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #0aff00;
            --text-glow: 0 0 10px rgba(0, 243, 255, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation; /* Melhora resposta ao toque */
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Alterado para min-height para permitir scroll se necessário */
            overflow: hidden; /* Evita scroll durante o jogo */
        }

        /* Efeito de Fundo de Grade (Grid) */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(transparent 95%, var(--grid-color) 50%),
                linear-gradient(90deg, transparent 95%, var(--grid-color) 50%);
            background-size: 20px 20px;
            z-index: -1;
            opacity: 0.5;
        }

        /* Container do Título (Mantendo sua personalização) */
        .title-container {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 20;
        }

        h1 {
            font-size: 2.5rem; /* Levemente menor para caber em mobile */
            text-transform: uppercase;
            text-shadow: var(--text-glow), 0 0 20px var(--neon-blue);
            letter-spacing: 3px;
        }

        .subtitle-neon {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-blue);
            font-size: 1.2rem;
            text-shadow: var(--text-glow), 0 0 10px rgba(0, 243, 255, 0.5);
            letter-spacing: 2px;
            font-weight: 400;
        }
        
        p.instructions {
            margin-bottom: 15px;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            text-align: center;
        }

        #game-container {
            position: relative;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 20px rgba(0, 243, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.8);
            /* Responsividade do Canvas */
            max-width: 95vw; /* Ocupa no máximo 95% da largura da tela */
            max-height: 60vh; /* Não ocupa mais que 60% da altura */
        }

        canvas {
            display: block;
            width: 100%; /* Ajusta a largura do canvas ao container */
            height: 100%; /* Ajusta a altura */
        }

        #ui-layer {
            margin-top: 15px;
            display: flex;
            gap: 2rem;
            font-size: 1rem;
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* --- CONTROLES MOBILE (Novidade) --- */
        #mobile-controls {
            display: none; /* Invisível no PC */
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
            z-index: 20;
        }

        /* Só mostra os controles em telas menores que 768px (Tablets e Celulares) */
        @media (max-width: 768px) {
            #mobile-controls {
                display: grid;
            }
            h1 { font-size: 1.8rem; }
            .subtitle-neon { font-size: 1rem; }
        }

        .control-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 10px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .control-btn:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Posicionamento dos botões em Cruz */
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }


        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            animation: scroll 10s linear infinite;
        }

        @keyframes scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .game-over-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid var(--neon-pink);
            padding: 2rem;
            text-align: center;
            display: none;
            box-shadow: 0 0 30px var(--neon-pink);
            z-index: 30;
            min-width: 280px;
        }

        .game-over-modal h2 {
            color: var(--neon-pink);
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--neon-pink);
        }

        button.restart-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 5px var(--neon-green);
            margin-top: 10px;
        }

        button.restart-btn:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 20px var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="title-container">
        <h1>Cyber Snake</h1>
        <span class="subtitle-neon">- By Celso Jr.</span>
    </div>
    <p class="instructions">Pressione as SETAS para começar</p>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="game-over-modal" id="gameOverModal">
            <h2>SYSTEM FAILURE</h2>
            <p>Pontuação Final: <span id="finalScore">0</span></p>
            <br>
            <button class="restart-btn" onclick="resetGame()">Reiniciar</button>
        </div>
    </div>

    <div id="ui-layer">
        <div>SCORE: <span id="scoreDisplay">0</span></div>
        <div>HIGHSCORE: <span id="highScoreDisplay">0</span></div>
    </div>

    <div id="mobile-controls">
        <div class="control-btn btn-up" onclick="handleMobileInput('up')">▲</div>
        <div class="control-btn btn-left" onclick="handleMobileInput('left')">◀</div>
        <div class="control-btn btn-down" onclick="handleMobileInput('down')">▼</div>
        <div class="control-btn btn-right" onclick="handleMobileInput('right')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreDisplay');
        const highScoreElement = document.getElementById('highScoreDisplay');
        const finalScoreElement = document.getElementById('finalScore');
        const modal = document.getElementById('gameOverModal');

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;
        
        let score = 0;
        let highScore = localStorage.getItem('cyberSnakeHighScore') || 0;
        highScoreElement.innerText = highScore;

        let velocity = { x: 0, y: 0 };
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let gameInterval;
        let isGameRunning = false;

        const colors = {
            snakeHead: '#00f3ff',
            snakeBody: '#0099aa',
            food: '#ff00ff',
            bg: '#050505'
        };

        modal.style.display = 'none';

        document.addEventListener('keydown', changeDirection);

        function startGame() {
            if (isGameRunning) return;
            
            isGameRunning = true;
            velocity = { x: 1, y: 0 }; 
            modal.style.display = 'none';
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100); 
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            score = 0;
            scoreElement.innerText = score;
            modal.style.display = 'none';
            clearInterval(gameInterval);
            isGameRunning = false;
            
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawFood();
            drawSnake();
            
            startGame();
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.innerText = score;
                generateFood();
                canvas.style.borderColor = colors.food;
                setTimeout(() => canvas.style.borderColor = colors.snakeHead, 100);
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawFood();
            drawSnake();
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = index === 0 ? colors.snakeHead : colors.snakeBody;
                ctx.fillStyle = index === 0 ? colors.snakeHead : colors.snakeBody;
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;
            });
        }

        function drawFood() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.food;
            ctx.fillStyle = colors.food;
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            ctx.shadowBlur = 0;
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            }
        }

        function gameOver() {
            clearInterval(gameInterval);
            isGameRunning = false;
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyberSnakeHighScore', highScore);
                highScoreElement.innerText = highScore;
            }

            finalScoreElement.innerText = score;
            modal.style.display = 'block';
        }

        // Função unificada para controle (Teclado)
        function changeDirection(event) {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(event.code) > -1) {
                event.preventDefault();
            }
            
            // Mapa de teclas para direções
            const keyMap = {
                37: 'left',
                38: 'up',
                39: 'right',
                40: 'down'
            };

            if (keyMap[event.keyCode]) {
                processDirection(keyMap[event.keyCode]);
            }
        }

        // Função unificada para controle (Mobile Touch)
        function handleMobileInput(direction) {
            // Vibração tátil leve ao tocar (se suportado pelo celular)
            if (navigator.vibrate) navigator.vibrate(30);
            processDirection(direction);
        }

        // Lógica principal de movimento
        function processDirection(dir) {
            if (!isGameRunning && modal.style.display === 'none') {
                startGame();
            }
            if (!isGameRunning) return;

            const goingUp = velocity.y === -1;
            const goingDown = velocity.y === 1;
            const goingRight = velocity.x === 1;
            const goingLeft = velocity.x === -1;

            if (dir === 'left' && !goingRight) {
                velocity = { x: -1, y: 0 };
            }
            if (dir === 'up' && !goingDown) {
                velocity = { x: 0, y: -1 };
            }
            if (dir === 'right' && !goingLeft) {
                velocity = { x: 1, y: 0 };
            }
            if (dir === 'down' && !goingUp) {
                velocity = { x: 0, y: 1 };
            }
        }

        draw();
    </script>
</body>
</html>
